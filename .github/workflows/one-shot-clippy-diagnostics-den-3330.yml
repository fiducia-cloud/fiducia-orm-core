name: one-shot clippy diagnostics DEN-3330

on:
  push:
    branches:
      - alexanderdmills/den-3330-commercial-orm-projections
    paths:
      - .github/workflows/one-shot-clippy-diagnostics-den-3330.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - name: Capture all-feature clippy diagnostics
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > clippy-den-3330.log 2>&1
          status=$?
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Export diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clippy-den-3330
          path: clippy-den-3330.log
          if-no-files-found: error
          retention-days: 3
      - name: Preserve failing conclusion
        if: always()
        shell: bash
        run: test "${{ steps.clippy.outputs.exit_code }}" = "0"
