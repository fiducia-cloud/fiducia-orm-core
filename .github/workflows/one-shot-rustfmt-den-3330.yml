name: one-shot-rustfmt-den-3330

on:
  push:
    branches:
      - alexanderdmills/den-3330-commercial-orm-projections
    paths:
      - .github/workflows/one-shot-rustfmt-den-3330.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Commit formatting and remove this one-shot workflow
        run: |
          rm -f .github/workflows/one-shot-rustfmt-den-3330.yml
          git config user.name 'fiducia-orm-format-bot'
          git config user.email 'fiducia-orm-format-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed after rustfmt; one-shot workflow removed.'
          else
            git commit -m 'style(DEN-3330): apply canonical rustfmt output'
            git push
          fi
