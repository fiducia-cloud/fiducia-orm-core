name: temporary-zed-lock-refresh

on:
  push:
    branches:
      - chore/den-3945-fleet-conformance-20260912

permissions:
  contents: write

concurrency:
  group: zed-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Zed CLI v0.3.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zed.tar.gz"
          release_dir="$RUNNER_TEMP/zed-release"
          curl --fail --location --retry 3 --retry-all-errors \
            -o "$archive" \
            https://github.com/zed-pkg/zed-cli/releases/download/v0.3.0/zed-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' \
            f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a \
            "$archive" | sha256sum --check --strict
          mkdir -p "$release_dir" "$HOME/.local/bin"
          tar -xzf "$archive" -C "$release_dir"
          zed_bin="$(find "$release_dir" -type f -name zed -perm -111 -print -quit)"
          test -n "$zed_bin"
          install -m 0755 "$zed_bin" "$HOME/.local/bin/zed"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Resolve and validate lock
        shell: bash
        env:
          ZED_PKG_INTERACTIVE: "false"
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zed --version
          zed install --allow-build
          test -s .zpkg.lock
          test "$(wc -l < .zpkg.lock)" -gt 1
      - name: Commit resolver-generated lock only when changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .zpkg.lock >/dev/null 2>&1 && git diff --quiet -- .zpkg.lock; then
            echo '.zpkg.lock is already current'
            exit 0
          fi
          content="$(base64 -w0 .zpkg.lock)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.zpkg.lock?ref=${GITHUB_REF_NAME}" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/.zpkg.lock" -f message='chore: commit resolver-generated Zed lock' -f content="$content" -f branch="$GITHUB_REF_NAME")
          if [ -n "$current_sha" ]; then
            args+=(-f sha="$current_sha")
          fi
          gh api "${args[@]}" >/dev/null
