[package]
org = "fiducia-cloud"
name = "fiducia-orm-core"
version = "0.2.0"
description = "Canonical opaque SeaORM and Diesel boundary for the fiducia-cloud organization"

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-orm-core"

[dependencies]
"oresoftware/k8s-libs-and-shared-defs" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [
  ".env",
  ".env.*",
  ".vendor/.zed/**",
  "target/**",
  "**/*.log",
]

[install]
dir = ".vendor/.zed"

[targets.rust]
dir = "."
adapter = "rust"

[scripts]
format = "cargo fmt --all -- --check"
lint = "cargo clippy --all-targets --all-features -- -D warnings"
test-default = "cargo test --all-targets"
test-read-write = "cargo test --all-targets --all-features"
test-doc = "cargo test --doc"
check-generation = "python3 tools/generate_commercial_projections.py --check && python3 tools/generate_dual_orm_runtime.py --check"
