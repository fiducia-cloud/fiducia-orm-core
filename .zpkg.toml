[package]
org = "fiducia-cloud"
name = "fiducia-orm-core"
version = "0.2.0"
description = "Canonical opaque SeaORM and Diesel boundary for the fiducia-cloud organization"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-orm-core"

[dependencies]
"fiducia-cloud/fiducia-interfaces" = "^0.1.0"
"fiducia-cloud/fiducia-lib-core" = "^0.1.0"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [
  ".env",
  ".env.*",
  "env/dec/**",
  ".vendor/.zed/**",
  ".zed/**",
  ".zed-pack/**",
  "target/**",
  "**/target/**",
  "**/node_modules/**",
  "**/.dart_tool/**",
  "**/*.log",
]

[install]
dir = ".vendor/.zed"

[targets.rust]
dir = "."
adapter = "rust"

[scripts]
test = "cargo test --all-targets --all-features"
