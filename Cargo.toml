[package]
name = "fiducia-orm-core"
version = "0.1.0"
edition = "2021"
description = "Opaque, role-aware SeaORM query boundary for fiducia-cloud"
repository = "https://github.com/fiducia-cloud/fiducia-orm-core"
publish = false

[lib]
name = "fiducia_orm_core"

[features]
# Browser-facing and other read consumers get only the opaque read context and
# named read functions. API servers must opt into every write symbol.
default = ["read-only"]
read-only = []
read-write = ["read-only"]

[dependencies]
sea-orm = { version = "1", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-uuid",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
