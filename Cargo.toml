[package]
name = "fiducia-orm-core"
version = "0.2.0"
edition = "2021"
description = "Canonical opaque Fiducia SeaORM and Diesel boundary with peer-authority generation."
repository = "https://github.com/fiducia-cloud/fiducia-orm-core"
publish = false

[lib]
name = "fiducia_orm_core"

[features]
# Browser-facing and other read consumers get only the opaque read context and
# named read functions. API servers must opt into every write symbol.
default = ["read-only"]
read-only = []
read-write = ["read-only"]
commercial-sea-orm = []
commercial-diesel = [
  "dep:bigdecimal",
  "dep:chrono",
  "dep:diesel",
  "dep:serde_json",
  "dep:tokio",
]
commercial-dual-orm = ["commercial-sea-orm", "commercial-diesel"]

[dependencies]
bigdecimal = { version = "0.4", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
diesel = { version = "=2.3.12", default-features = false, features = [
  "32-column-tables",
  "chrono",
  "numeric",
  "postgres",
  "serde_json",
], optional = true }
sea-orm = { version = "1", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-json",
  "with-rust_decimal",
  "with-uuid",
] }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
