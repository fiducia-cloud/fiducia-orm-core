schema = 2

[tasks.format]
run = ["cargo fmt --all -- --check"]

[tasks.lint]
run = ["cargo clippy --all-targets --all-features -- -D warnings"]

[tasks.test-default]
run = ["cargo test --all-targets"]

[tasks.test-read-write]
run = ["cargo test --all-targets --all-features"]

[tasks.test-doc]
run = ["cargo test --doc"]

[tasks.check-generation]
run = ["python3 tools/generate_commercial_projections.py --check && python3 tools/generate_dual_orm_runtime.py --check"]

[tasks.check]
description = "Run repository-local ORM gates without applying migrations"
aliases = ["ci"]
depends = ["format", "lint", "test-default", "test-read-write", "test-doc", "check-generation"]
run = ["echo 'check: all ORM gates passed'"]
